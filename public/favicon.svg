<!-- public/favicon.svg (安全な検索アイコン) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景 (クリーンな白) -->
  <rect width="100" height="100" fill="#ffffff"/>

  <!-- 虫眼鏡のアウトライン (濃いグレー/ブルー) -->
  <circle cx="50" cy="46" r="30" fill="none" stroke="#1e293b" stroke-width="8"/>
  <line x1="72" y1="68" x2="88" y2="84" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>

  <!-- レンズ内部の検索表現 (光の輝き) -->
  <circle cx="50" cy="46" r="15" fill="#2563eb"/>
  <circle cx="55" cy="40" r="6" fill="#ffffff" opacity="0.6"/>
</svg>
